# Example OTDR simulation configuration
# This simulates a typical FTTH (Fiber to the Home) drop cable

simulation:
  # Seed for reproducible results
  seed: 42
  # Output directory for generated files
  output_dir: "./example_output"
  # Base filename (wavelength will be appended)
  output_basename: "ftth_drop_example"

# Define the fiber network
network:
  name: "Example FTTH Drop Cable"
  
  # Fiber segments in order from CO to customer
  segments:
    # Feeder fiber from central office
    - length_m: 1500.0
      fiber_type: G652D
    
    # Distribution fiber
    - length_m: 500.0
      fiber_type: G657A1
    
    # Drop cable to customer premises
    - length_m: 200.0
      fiber_type: G657A2
  
  # Events along the fiber path
  events:
    # CO connector at start
    - type: connector
      position_m: 0.0
      insertion_loss_db: 0.3
      connector_type: UPC
      state:
        mated:
          return_loss_db: 45.0
    
    # Fusion splice joining feeder to distribution
    - type: splice
      position_m: 1500.0
      insertion_loss_db: 0.05
      splice_type: fusion
    
    # Macrobend where cable turns around building corner
    - type: macrobend
      position_m: 1800.0
      bend_radius_mm: 15.0
      turns: 2.0
      span_m: 0.5
    
    # Splice to drop cable
    - type: splice
      position_m: 2000.0
      insertion_loss_db: 0.08
      splice_type: fusion
    
    # Customer premises connector (open/unmated for testing)
    - type: connector
      position_m: 2200.0
      insertion_loss_db: 0.35
      connector_type: APC
      state: open

# Acquisition settings - simulate at three common wavelengths
acquisition:
  # Multiple wavelengths for macrobend detection
  wavelengths:
    - wavelength_nm: 1310
      pulse_width_ns: 30.0
    
    - wavelength_nm: 1550
      pulse_width_ns: 30.0
    
    - wavelength_nm: 1625
      pulse_width_ns: 30.0
  
  # OTDR range setting
  range_m: 5000.0
  
  # Averaging time
  averaging_time_s: 30.0
  
  # Pulse shape
  pulse_shape: !real_rectangular {}
  
  # Optional launch cable between OTDR and fiber under test
  # This creates the "user offset" in the trace
  launch_cable:
    length_m: 100.0
    connector_type: UPC
    connector_loss_db: 0.25

# Hardware characteristics (all optional - defaults shown here)
hardware:
  noise_floor_dbm: -65.0
  dynamic_range_db: 32.0
  detector_bandwidth_mhz: 50.0
  saturation_power_mw: 0.1
  event_dead_zone_m: 3.0
  attenuation_dead_zone_m: 3.0
  group_index: 1.4682
  injection_power_mw: 1.0
  # Internal fiber before the front panel connector (typically 20-100m)
  front_panel_offset_m: 50.0
