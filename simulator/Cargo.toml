[package]
name = "otdrs-simulator"
version = "0.1.0"
edition = "2024"
authors = ["James Harrison <james@talkunafraid.co.uk>"]
description = "OTDR trace simulator for testing and ML training"
license = "LGPL-3.0"

[dependencies]
# Workspace dependency for SOR file generation
otdrs = { path = ".." }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Math and DSP
rustfft = "6.2"

# Random number generation (reproducible)
rand = "0.8"
rand_chacha = "0.3"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2"

# PDF report generation
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "line_series", "full_palette", "ttf"] }
# Enable embedded_images to use printpdf's bundled image crate for compatibility
printpdf = { version = "0.7", features = ["embedded_images"] }
# Same version as printpdf uses internally to ensure unified trait implementations
image = { version = "0.24", default-features = false, features = ["bmp"] }
rayon = "1.11.0"
uom = "0.37.0"

[dev-dependencies]
tempfile = "3"
approx = "0.5"  # For floating-point comparisons in tests

[lib]
name = "otdrs_simulator"
path = "src/lib.rs"

[[bin]]
name = "otdrs-sim"
path = "src/main.rs"
